<!DOCTYPE html>

    <meta charset="utf-8">

    <title>

<script
    src="https://aframe.io/releases/1.8.0/aframe.min.js">
</script>

<!--(Door Animation Script)-->

<script>
  AFRAME.registerComponent('swing-door', {
    schema: {
      openAngle: { type: 'number', default: 90 }
    },
    init: function () {
      this.isOpen = false;
      this.el.addEventListener('click', () => {
        this.isOpen = !this.isOpen;
        const targetY = this.isOpen ? this.data.openAngle : 0;
        this.el.setAttribute('animation', {
          property: 'rotation',
          to: `0 ${targetY} 0`,
          dur: 600,
          easing: 'easeInOutQuad'
        });
      });
    }
  });
</script>

</head>
